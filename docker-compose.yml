services:
  db:
    image: postgres:16-alpine
    container_name: naravia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naravia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-naravia}
    volumes:
      - naravia-pgdata:/var/lib/postgresql/data
    # Port database tidak dibuka ke luar; hanya container aplikasi yang bisa mengakses
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  naravia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naravia-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Menimpa DATABASE_URL dari .env agar selalu menunjuk ke service db di jaringan Docker
      - DATABASE_URL=postgres://${POSTGRES_USER:-naravia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-naravia}
    volumes:
      # File unggahan avatar persisten
      - ./public/uploads:/app/public/uploads
      # Database SQLite lama untuk migrasi satu kali (tidak read-only: SQLite mode WAL butuh akses tulis ke file -shm)
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  naravia-pgdata:
